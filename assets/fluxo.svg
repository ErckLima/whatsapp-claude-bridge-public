  <path d="M90,64 H810" stroke="#25d366" stroke-opacity=".25" stroke-width="2" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M810,178 H90" stroke="#e8915b" stroke-opacity=".25" stroke-width="2" stroke-dasharray="6 8">
